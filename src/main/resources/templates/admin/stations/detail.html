<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{admin/layout/layout}"
>
  <head>
    <title>Station Detail</title>
    <!-- font-awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div layout:fragment="content">
      <nav class="page-breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
          <li class="breadcrumb-item">
            <a th:href="@{/admin/stations}">Stations</a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">Detail</li>
        </ol>
      </nav>
      <h3>Station Detail</h3>

      <a
        class="mt-3 btn btn-outline-secondary mb-3 d-inline-flex align-items-center justify-content-center"
        th:href="@{/admin/stations/index}"
      >
        <i class="btn-icon-prepend" data-feather="chevron-left"></i>
        <span>Back</span>
      </a>

      <div class="row">
        <div class="col-md-6">
          <!-- thông báo thất bại -->
          <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
          </div>
          <div class="card" th:if="${station}">
            <div class="card-header text-center">
              <h1 class="text-center text-danger">Station Details</h1>
            </div>
            <div class="card-body">
              <div class="row mb-3">
                <div class="col-md-3 text-end text-secondary">
                  <strong>Station ID:</strong>
                </div>
                <div class="col-md-9">
                  <span th:text="${station.stationId}"></span>
                </div>
              </div>
              <div class="row mb-3">
                <div class="col-md-3 text-end text-secondary">
                  <strong>Code:</strong>
                </div>
                <div class="col-md-9">
                  <span th:text="${station.code}"></span>
                </div>
              </div>
              <div class="row mb-3">
                <div class="col-md-3 text-end text-secondary">
                  <strong>Name:</strong>
                </div>
                <div class="col-md-9">
                  <span th:text="${station.stationName}"></span>
                </div>
              </div>
              <div class="row mb-3">
                <div class="col-md-3 text-end text-secondary">
                  <strong>Province:</strong>
                </div>
                <div class="col-md-9">
                  <span th:text="${station.province.name}"></span>
                </div>
              </div>
              <div class="row mb-3">
                <div class="col-md-3 text-end text-secondary">
                  <strong>GoogleMap Link:</strong>
                </div>
                <div class="col-md-9">
                  <span th:text="${station.GGMapLink}"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
