<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{admin/layout/layout}"
>
  <head>
    <title>Edit Station</title>
    <!-- font-awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div layout:fragment="content">
      <nav class="page-breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
          <li class="breadcrumb-item">
            <a th:href="@{/admin/stations}">Stations</a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">Edit</li>
        </ol>
      </nav>
      <h3>Edit Station</h3>

      <a
        class="mt-3 btn btn-outline-secondary mb-3 d-inline-flex align-items-center justify-content-center"
        th:href="@{/admin/stations/index}"
      >
        <i class="btn-icon-prepend" data-feather="chevron-left"></i>
        <span>Back</span>
      </a>
      <div class="row">
        <div class="col-md-6">
          <!-- Kiểm tra nếu có thông báo thành công -->
          <div
            th:if="${successMessage}"
            class="alert alert-success"
            role="alert"
          >
            <span th:text="${successMessage}"></span>
          </div>
          <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
          </div>
          <div th:if="${station}">
            <form
              th:action="@{/admin/stations/edit/{id}(id=${station.stationId})}"
              th:object="${station}"
              method="post"
            >
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title text-primary">Station ID:</h5>
                                <span th:text="*{stationId}"></span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title text-primary">Code:</h5>
                                <input
                                        th:field="*{code}"
                                        placeholder="Enter Code"
                                        type="text"
                                        class="form-control"
                                />
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title text-primary">Name:</h5>
                                <input
                                        th:field="*{stationName}"
                                        placeholder="Enter Name"
                                        type="text"
                                        class="form-control"
                                />
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title text-primary">Province:</h5>
                                <select
                                        id="province"
                                        th:field="*{province.provinceId}"
                                        class="form-control cbb-station"
                                >
                                    <option
                                            th:each="province : ${provinces}"
                                            th:value="${province.provinceId}"
                                            th:text="${province.name}"
                                    ></option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-12 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title text-primary">GoogleMap Link:</h5>
                                <input
                                        th:field="*{GGMapLink}"
                                        placeholder="Enter GoogleMap Link"
                                        type="text"
                                        class="form-control"
                                />
                            </div>
                        </div>
                    </div>
                </div>
              <button type="submit" class="btn btn-primary btn-lg">
                <i class="fa-solid fa-check"></i> Save Edit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
