<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{admin/layout/layout}">

<div layout:fragment="head">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style th:inline="css">

    </style>
</div>


<div layout:fragment="content">
    <div class="container-fluid mt-1">
        <nav class="page-breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/seats/index}">Seats</a></li>
                <li class="breadcrumb-item active" aria-current="page">Edit#<span th:text="${seat.seatId}"></span></li>
            </ol>
        </nav>

        <div class="row mb-2">
            <div class="col-md-4 d-flex align-items-center ">
                <a th:href="@{${session.previousSeatsPage}}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back
                </a>
                <h3 class="d-inline-block me-2 ms-3"
                    th:text=" ${'Seat Edit #' +  seat.seatId + ' - ' + seat.seatNumber}"> </h3>
            </div>
        </div>

        <form id="seatDetailForm" class="card" th:action="@{/admin/seats/edit/{id}(id=${seat.seatId})}"
            th:object="${seat}" method="post">


            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-group ">
                            <label for="seatNumber" class="form-label"><strong>Seat Number:</strong></label>
                            <input type="text" class="form-control" id="seatNumber" th:field="*{seatNumber}">

                        </div>
                        <div class="form-group mt-2">
                            <label for="compartmentNumber" class="form-label"><strong>Compartment
                                    Number:</strong></label>
                            <input type="text" class="form-control" id="compartmentNumber"
                                th:field="*{compartmentNumber}">

                        </div>

                        <!-- Train Info -->
                        <div class="form-group mt-2">
                            <label for="trainId" class="form-label"><strong>Train Info:</strong></label>
                            <input type="text" class="form-control" id="trainId"
                                th:value="${seat.carriage.train.trainNumber + '-' + seat.carriage.carriageNumber}"
                                readonly>

                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="seatTypeId" class="form-label"><strong>Seat Type:</strong></label>
                            <select id="seatTypeId" th:field="*{seatType.seatTypeId}" class="form-select select2"
                                aria-label="Choose Seat Type">
                                <option value="" th:value="-1" disabled>Choose Seat Type</option>
                                <option th:each="seatType : ${getAllSeatTypes}" th:value="${seatType.seatTypeId}"
                                    th:text="${seatType.seatType + ' (' + seatType.code + ')'}"
                                    th:data-code="${seatType.code}" th:data-description="${seatType.description}">
                                </option>
                            </select>

                        </div>
                        <div class="form-group mt-2">
                            <label for="floor" class="form-label"><strong>Floor:</strong></label>
                            <input type="text" class="form-control" id="floor" th:field="*{floor}">
                        </div>
                        <div class="form-group mt-2">
                            <label for="status" class="form-label"><strong>Status:</strong></label>
                            <div class="form-check">
                                <input class="form-check-input " type="radio" name="status" id="statusAvailable"
                                    th:field="*{status}" th:value="available" disabled>
                                <label class="form-check-label badge bg-success" for="statusAvailable">
                                    Available
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input " type="radio" name="status" id="statusHolding"
                                    th:field="*{status}" th:value="holding" disabled>
                                <label class="form-check-label badge bg-warning" for="statusHolding">
                                    Holding
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input " type="radio" name="status" id="statusBooked"
                                    th:field="*{status}" th:value="booked" disabled>
                                <label class="form-check-label badge bg-danger" for="statusBooked">
                                    Booked
                                </label>
                            </div>
                            <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}"
                                class="text-small text-danger"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-footer text-end">
                <button type="button" th:data-url="@{/admin/seats/delete/{id}(id=${seat.seatId})}"
                    class="btn btn-outline-danger deleteBtn">
                    <i class="bi bi-trash me-1"></i>Delete
                </button>

                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-save me-1"></i>Update
                </button>
            </div>
        </form>

        <form th:action="@{/admin/seats/delete/{id}(id=${seat.seatId})}" method="post" class="deleteForm">
            <input type="hidden" name="seatId" th:value="${seat.seatId}">
        </form>

    </div>

    <!-- Tabs -->
    <ul class="nav nav-tabs mt-4" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tickets-tab" data-bs-toggle="tab" data-bs-target="#tickets"
                type="button" role="tab" aria-controls="tickets" aria-selected="true">Tickets</button>
        </li>
    </ul>
    <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="tickets" role="tabpanel" aria-labelledby="tickets-tab">
            <table class="table table-striped text-center">
                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Booking Date</th>
                        <th>Passenger</th>
                        <th>Price</th>
                        <th>Train info</th>
                        <th>Booking Info</th>
                        <th>Status</th>
                        <th style="width: 60px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ticket : ${ticketsOfSeat}">
                        <td th:text="${ticket.ticketId}"></td>

                        <td th:text="${#temporals.format(ticket.bookingDate, 'dd-MM-yyyy')}"></td>

                        <td th:text="${ticket.passenger != null ? ticket.passenger.fullName : 'N/A'}"></td>

                        <td th:text="${#numbers.formatDecimal(ticket.price, 0, 'COMMA', 0, 'POINT')}"></td>

                        <td>
                            <span th:if="${ticket.seat != null}"
                                th:text="${ ticket.seat.carriage.train.trainNumber + '-' + ticket.seat.carriage.carriageNumber + '-' + ticket.seat.seatNumber}">
                            </span>
                        </td>
                        <td>
                            <a th:if="${ticket.booking != null}"
                                th:href="@{/admin/bookings/detail/{id}(id=${ticket.booking.bookingId})}"
                                class="text-decoration-none">
                                <span class="badge bg-primary">
                                    <i class="bi bi-receipt me-1"></i>
                                    <span th:text="${'#' + ticket.booking.bookingId}"></span>
                                </span>
                            </a>
                            <span th:unless="${ticket.booking != null}" class="badge bg-secondary">No
                                Booking</span>
                        </td>

                        <td>
                            <span
                                th:class="${ticket.status == 'active' ? 'badge bg-success' : 'badge bg-danger'}"
                                th:text="${ticket.status}"></span>
                        </td>

                        <td>
                            <a th:href="@{/admin/tickets/edit/{id}(id=${ticket.ticketId})}">
                                <i class="bi bi-box-arrow-up-right text-primary"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


<!--  notifications -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div th:if="${not #lists.isEmpty(successMessages)}" class="toast show" role="alert" aria-live="assertive"
        aria-atomic="true">
        <div class="toast-header bg-success text-white">
            <i class="bi bi-check-circle-fill me-2"></i>
            <strong class="me-auto">Success Notifications</strong>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"
                aria-label="Close"></button>
        </div>
        <div class="toast-body">
            <ul class="list-unstyled m-0">
                <li th:each="message : ${successMessages}" class="success-message">
                    <i class="bi bi-check2 me-2"></i>
                    <span th:text="${message}"></span>
                </li>
            </ul>
        </div>
    </div>

    <div th:if="${not #lists.isEmpty(errorMessages)}" class="toast show" role="alert" aria-live="assertive"
        aria-atomic="true">
        <div class="toast-header bg-danger text-white">
            <i class="bi bi-exclamation-circle-fill me-2"></i>
            <strong class="me-auto">Error Notifications</strong>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"
                aria-label="Close"></button>
        </div>
        <div class="toast-body">
            <ul class="list-unstyled m-0">
                <li th:each="message : ${errorMessages}" class="error-message">
                    <i class="bi bi-x-circle me-2"></i>
                    <span th:text="${message}"></span>
                </li>
            </ul>
        </div>
    </div>
</div>

</div>

<div layout:fragment="scripts">

    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script th:inline="javascript">
        $(document).ready(function () {
            $('.deleteBtn').on('click', function (e) {
                let form = $('.deleteForm');
                $.confirm({
                    title: 'Confirm deletion',
                    content: 'Are you sure you want to delete this item?',
                    type: 'red',
                    buttons: {
                        ok: {
                            text: 'OK',
                            btnClass: 'btn-danger',
                            action: function () {
                                form.submit();
                            }
                        },
                        cancel: {
                            text: 'Hủy',
                            action: function () {
                            }
                        }
                    }
                });
            });



            // Tự động ẩn toast sau 3 giây
            setTimeout(function () {
                $('.toast').toast('hide');
            }, 3000);

            // Khởi tạo toast
            $('.toast').toast({
                delay: 3000
            });
        });

    </script>

</div>


</html>
