<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout/layout}"
    xmlns:th="http://www.thymeleaf.org">

<div layout:fragment="head">
    <style th:inline="css">
       
    </style>
</div>

<div layout:fragment="content">

    <nav class="page-breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
            <li class="breadcrumb-item" th:href="@{/admin/seats}">Seats</li>
            <li class="breadcrumb-item active" aria-current="page">List</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center flex-wrap grid-margin">
        <h3>Seats Management</h3>
        <div class="d-flex align-items-center flex-wrap text-nowrap">
            <button type="button" class="btn btn-outline-primary btn-icon-text me-2 mb-2 mb-md-0"
                data-bs-toggle="popover" data-bs-placement="bottom" data-bs-content="#popover-content">
                <i class="btn-icon-prepend" data-feather="settings"></i>
                Options
            </button>
            <a th:href="@{/admin/seats/create}" type="button" class="btn btn-primary btn-icon-text mb-2 mb-md-0">
                <i class="btn-icon-prepend" data-feather="plus-circle"></i>
                Create
            </a>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 grid-margin stretch-card">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="dataTableExample" class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Seat Number</th>
                                    <th>Seat Type</th>
                                    <th>Floor</th>
                                    <th>Compartment Number</th>
                                    <th>Cariage</th>

                                    <th>Status</th>
                                    <th style="width: 60px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="seat : ${seats}">
                                    <td th:text="${seat.seatId}"></td>
                                    <td th:text="${seat.seatNumber}"></td>
                                    <td th:text="${seat.seatType.seatType}"></td>
                                    <td th:text="${seat.floor}"></td>
                                    <td th:text="${seat.compartmentNumber}"></td>
                                    <td th:text="${seat.carriage.carriageId}"></td>
                                    <td>
                                        <span th:class="${seat.status ? 'badge bg-danger' : 'badge bg-success'}"
                                            th:text="${seat.status ? 'Đã đặt' : 'Trống'}"></span>
                                    </td>
                                    <td class="actions">
                                        <a th:href="@{/admin/seats/detail/{id}(id=${seat.seatId})}">
                                            <i class="btn-icon-prepend text-primary" data-feather="eye"></i>
                                        </a>
                                        <a th:href="@{/admin/seats/edit/{id}(id=${seat.seatId})}">
                                            <i class="btn-icon-prepend text-warning" data-feather="edit"></i>
                                        </a>

                                        <form th:action="@{/admin/seats/delete/{id}(id=${seat.seatId})}" method="post"
                                            class="deleteForm">
                                            <div type="button" class="deleteBtn">
                                                <i class="btn-icon-prepend text-danger" data-feather="trash-2"></i>
                                            </div>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <nav class="d-flex justify-content-between align-items-center mt-3">
                        <!-- Sizing -->
                        <div th:replace="~{/admin/fragments/_table-size}"></div>
                        <!-- Pagination -->
                        <ul class="pagination justify-content-center">
                            <!-- Thêm nút về trang đầu -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/seats/index(page=0, size=${size})}"
                                    aria-label="First">
                                    <span aria-hidden="true">First</span>
                                </a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link"
                                    th:href="@{/admin/seats/index(page=${currentPage - 1}, size=${size})}"
                                    aria-label="Previous">
                                    <span aria-hidden="true">
                                        <i class="btn-icon-prepend" data-feather="chevron-left"></i>
                                    </span>
                                </a>
                            </li>

                            <li class="page-item" th:each="i : ${#numbers.sequence(currentPage - 2, currentPage + 2)}"
                                th:if="${i >= 0 and i <= totalPages - 1}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:text="${i + 1}"
                                    th:href="@{/admin/seats/index(page=${i}, size=${size})}">1</a>
                            </li>

                            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                <a class="page-link"
                                    th:href="@{/admin/seats/index(page=${currentPage + 1}, size=${size})}"
                                    aria-label="Next">
                                    <span aria-hidden="true">
                                        <i class="btn-icon-prepend" data-feather="chevron-right"></i>
                                    </span>
                                </a>
                            </li>

                            <!-- Thêm nút về trang cuối -->
                            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                <a class="page-link"
                                    th:href="@{/admin/seats/index(page=${totalPages - 1}, size=${size})}"
                                    aria-label="Last">
                                    <span aria-hidden="true">Last</span>
                                </a>
                            </li>
                        </ul>
                        <!-- Pagination -->
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Popover Content -->
    <div id="popover-content" style="display: none;">
        <button class='btn btn-sm btn-outline-primary mb-2'><i class="btn-icon-prepend" data-feather="upload"></i>
            Import</button><br>
        <button class='btn btn-sm btn-outline-primary'><i class="btn-icon-prepend" data-feather="download"></i>
            Export</button>
    </div>
</div>

<div layout:fragment="scripts">
    <script>
        $(document).ready(function () {
            $('#dataTableExample').DataTable({
                "paging": false,
                "info": false,
            });

            $('.deleteBtn').on('click', function (e) {
                e.preventDefault();
                var form = $(this).closest('form');

                $.confirm({
                    title: 'Confirm deletion',
                    content: 'Are you sure you want to delete this item?',
                    type: 'red',
                    buttons: {
                        ok: {
                            text: 'OK',
                            btnClass: 'btn-danger',
                            action: function () {
                                form.submit();
                            }
                        },
                        cancel: {
                            text: 'Cancel',
                            action: function () {
                            }
                        }
                    }
                });
            });

            let popoverTriggerList = Array.from(document.querySelectorAll('[data-bs-toggle="popover"]'));
            let popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
                return new bootstrap.Popover(popoverTriggerEl, {
                    html: true,
                    sanitize: false,
                    content: function () {
                        return document.querySelector(this.getAttribute('data-bs-content')).innerHTML;
                    }
                })
            })
        });
    </script>
</div>

</html>
