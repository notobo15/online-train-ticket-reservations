<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{admin/layout/layout}">

<div layout:fragment="head">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</div>

<div layout:fragment="content">
    <div class="container-fluid mt-1">
        <nav class="page-breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/tickets}">Tickets</a></li>
                <li class="breadcrumb-item active" aria-current="page">Edit#<span th:text="${ticket.ticketId}"></span>
                </li>
            </ol>
        </nav>

        <div class="row mb-2">
            <div class="col-md-6 d-flex align-items-center">
                <a th:href="@{${session.previousTicketsPage}}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back
                </a>
                <h3 class="d-inline-block me-2 ms-3" th:text="'Ticket Edit #' + ${ticket.ticketId}"></h3>
            </div>
        </div>

        <form class="card" th:action="@{/admin/tickets/edit/{id}(id=${ticket.ticketId})}" th:object="${ticket}"
            method="post">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <!-- Booking Info (Read-only) -->
                        <div class="form-group">
                            <label class="form-label"><strong>Booking Info:</strong></label>
                            <div class="input-group">
                                <input type="text" class="form-control"
                                    th:value="${ticket.booking != null ? '#' + ticket.booking.bookingId : ''}" readonly>
                                <a th:if="${ticket.booking != null}"
                                    th:href="@{/admin/bookings/detail/{id}(id=${ticket.booking.bookingId})}"
                                    class="btn btn-primary" title="View Booking Detail">
                                    <i class="bi bi-box-arrow-up-right"></i>
                                </a>
                            </div>
                        </div>

                        <!-- Passenger -->
                        <div class="form-group mt-3">
                            <label class="form-label"><strong>Passenger:</strong></label>
                            <input type="text" class="form-control"
                                th:value="${ticket.passenger != null ? ticket.passenger.identityCardNumber + ' - ' + ticket.passenger.fullName : ''}"
                                readonly>
                            <input type="hidden" th:field="*{passenger.passengerId}">
                        </div>

                        <!-- User Info -->
                        <div class="form-group mt-3">
                            <label class="form-label"><strong>User:</strong></label>
                            <input type="text" class="form-control" th:value="${ticket.booking != null && ticket.booking.user != null ? 
                                    ticket.booking.user.username + ' - ' + ticket.booking.user.email : ''}" readonly>
                        </div>

                        <!-- Price -->
                        <div class="form-group mt-3">
                            <label for="price" class="form-label"><strong>Price:</strong></label>
                            <input type="number" class="form-control" id="price" th:field="*{price}" step="0.01"
                                readonly>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <!-- Booking Date -->
                        <div class="form-group">
                            <label for="bookingDate" class="form-label"><strong>Booking Date:</strong></label>
                            <input type="datetime" class="form-control" id="bookingDate" th:field="*{bookingDate}"
                                readonly>
                        </div>

                        <!-- Train -->
                        <div class="form-group mt-3">
                            <label class="form-label"><strong>Train:</strong></label>
                            <input type="text" class="form-control" th:value="${ticket.carriageSeatMapping != null ? 
                                    ticket.carriageSeatMapping.carriage.train.trainNumber : ''}" readonly>

                        </div>

                        <!-- Carriage Seat -->
                        <div class="form-group mt-3">
                            <label class="form-label"><strong>Carriage Seat:</strong></label>
                            <input type="text" class="form-control" th:value="${ticket.carriageSeatMapping != null ? 
                
                                   'Car ' +ticket.carriageSeatMapping.carriage.carNumber + ' - Seat ' + 
                                    ticket.carriageSeatMapping.seat.seatNumber : ''}" readonly>
                            <input type="hidden" th:field="*{carriageSeatMapping.carriageSeatId}">
                        </div>

                        <!-- Status -->
                        <div class="form-group mt-3">
                            <label class="form-label"><strong>Status:</strong></label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="statusActive"
                                    th:field="*{status}" value="Active">
                                <label class="form-check-label badge bg-success" for="statusActive">
                                    Active
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="statusInactive"
                                    th:field="*{status}" value="Cancelled">
                                <label class="form-check-label badge bg-danger" for="statusInactive">
                                    Cancelled
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-footer text-end">
                <button type="button" class="btn btn-outline-danger deleteBtn">
                    <i class="bi bi-trash me-1"></i>Delete
                </button>
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-save me-1"></i>Update
                </button>
            </div>
        </form>

        <!-- Delete Form -->
        <form th:action="@{/admin/tickets/delete/{id}(id=${ticket.ticketId})}" method="post" class="deleteForm">
            <input type="hidden" name="ticketId" th:value="${ticket.ticketId}">
        </form>

        <!-- Notifications -->
        <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
            <!-- Success Messages -->
            <div th:if="${not #lists.isEmpty(successMessages)}" class="toast show" role="alert">
                <div class="toast-header bg-success text-white">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <strong class="me-auto">Success Notifications</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
                </div>
                <div class="toast-body">
                    <ul class="list-unstyled m-0">
                        <li th:each="message : ${successMessages}">
                            <i class="bi bi-check2 me-2"></i>
                            <span th:text="${message}"></span>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Error Messages -->
            <div th:if="${not #lists.isEmpty(errorMessages)}" class="toast show" role="alert">
                <div class="toast-header bg-danger text-white">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <strong class="me-auto">Error Notifications</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
                </div>
                <div class="toast-body">
                    <ul class="list-unstyled m-0">
                        <li th:each="message : ${errorMessages}">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            <span th:text="${message}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script th:inline="javascript">
        $(document).ready(function () {
            // Initialize Select2
            $('.select2').select2();

            // Delete confirmation
            $('.deleteBtn').on('click', function (e) {
                let form = $('.deleteForm');
                $.confirm({
                    title: 'Confirm deletion',
                    content: 'Are you sure you want to delete this ticket?',
                    type: 'red',
                    buttons: {
                        ok: {
                            text: 'OK',
                            btnClass: 'btn-danger',
                            action: function () {
                                form.submit();
                            }
                        },
                        cancel: {
                            text: 'Cancel'
                        }
                    }
                });
            });

            // Auto hide toasts
            setTimeout(function () {
                $('.toast').toast('hide');
            }, 3000);

            $('.toast').toast({
                delay: 3000
            });
        });
    </script>
</div>

</html>
