<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org"
    layout:decorate="~{admin/layout/layout}">

<div layout:fragment="head">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</div>

<div layout:fragment="content">
    <div class="container-fluid mt-1">
        <nav class="page-breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/prices}">Prices</a></li>
                <li class="breadcrumb-item active" aria-current="page">Edit#<span
                        th:text="${price.priceId}"></span></li>
            </ol>
        </nav>

        <div class="row mb-2">
            <div class="col-md-6 d-flex align-items-center">
                <a th:href="@{${session.previousPricesPage}}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back
                </a>
                <h3 class="d-inline-block me-2 ms-3" th:text="'Price Edit #' + ${price.priceId}"></h3>
            </div>
        </div>

        <form class="card" th:action="@{/admin/prices/edit/{id}(id=${price.priceId})}" th:object="${price}"
            method="post">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <input type="hidden" th:field="*{priceId}" />
                        
                        <!-- Price per Km -->
                        <div class="form-group">
                            <label for="pricePerKm" class="form-label"><strong>Price per Km:</strong></label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="pricePerKm" 
                                    th:field="*{pricePerKm}" step="100" min="0">
                                <span class="input-group-text">VND</span>
                            </div>
                            <span th:if="${#fields.hasErrors('pricePerKm')}" th:errors="*{pricePerKm}"
                                class="text-small text-danger"></span>
                        </div>

                        <!-- Surcharge Percentage -->
                        <div class="form-group mt-3">
                            <label for="surchargePercentage" class="form-label"><strong>Surcharge Percentage:</strong></label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="surchargePercentage" 
                                    th:field="*{surchargePercentage}" step="0.1" min="0">
                                <span class="input-group-text">%</span>
                            </div>
                            <span th:if="${#fields.hasErrors('surchargePercentage')}" th:errors="*{surchargePercentage}"
                                class="text-small text-danger"></span>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <!-- Current Seat Type Info (Read Only) -->
                        <div class="form-group">
                            <label class="form-label"><strong>Current Seat Type:</strong></label>
                            <input type="text" class="form-control" 
                                th:value="${price.seatType != null ? price.seatType.seatType + ' (' + price.seatType.code + ')' : 'Not Assigned'}" 
                                readonly>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-footer text-end">
                <button type="button" class="btn btn-outline-danger deleteBtn">
                    <i class="bi bi-trash me-1"></i>Delete
                </button>
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-save me-1"></i>Update
                </button>
            </div>
        </form>

        <!-- Delete Form -->
        <form th:action="@{/admin/prices/delete/{id}(id=${price.priceId})}" method="post" class="deleteForm">
            <input type="hidden" name="priceId" th:value="${price.priceId}">
        </form>

        <!-- Notifications -->
        <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
            <!-- Success Messages -->
            <div th:if="${not #lists.isEmpty(successMessages)}" class="toast show" role="alert" aria-live="assertive"
                aria-atomic="true">
                <div class="toast-header bg-success text-white">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <strong class="me-auto">Success Notifications</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"
                        aria-label="Close"></button>
                </div>
                <div class="toast-body">
                    <ul class="list-unstyled m-0">
                        <li th:each="message : ${successMessages}" class="success-message">
                            <i class="bi bi-check2 me-2"></i>
                            <span th:text="${message}"></span>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Error Messages -->
            <div th:if="${not #lists.isEmpty(errorMessages)}" class="toast show" role="alert" aria-live="assertive"
                aria-atomic="true">
                <div class="toast-header bg-danger text-white">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    <strong class="me-auto">Error Notifications</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"
                        aria-label="Close"></button>
                </div>
                <div class="toast-body">
                    <ul class="list-unstyled m-0">
                        <li th:each="message : ${errorMessages}" class="error-message">
                            <i class="bi bi-x-circle me-2"></i>
                            <span th:text="${message}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script th:inline="javascript">
        $(document).ready(function () {
            // Delete confirmation
            $('.deleteBtn').on('click', function (e) {
                let form = $('.deleteForm');
                $.confirm({
                    title: 'Confirm deletion',
                    content: 'Are you sure you want to delete this price?',
                    type: 'red',
                    buttons: {
                        ok: {
                            text: 'OK',
                            btnClass: 'btn-danger',
                            action: function () {
                                form.submit();
                            }
                        },
                        cancel: {
                            text: 'Cancel'
                        }
                    }
                });
            });

            // Auto hide toasts
            setTimeout(function () {
                $('.toast').toast('hide');
            }, 3000);

            $('.toast').toast({
                delay: 3000
            });
        });
    </script>
</div>

</html>
