<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout/layout}" xmlns:th="http://www.thymeleaf.org">

<div layout:fragment="content">
    <nav class="page-breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
            <li class="breadcrumb-item" th:href="@{/admin/train-journeys}">Train Journeys</li>
            <li class="breadcrumb-item active" aria-current="page">List</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center flex-wrap grid-margin">
        <h3>Train Journeys Management</h3>
        <a th:href="@{/admin/trainjourneys/create}" type="button" class="btn btn-outline-primary btn-icon-text">
            <i class="btn-icon-prepend" data-feather="plus"></i>
            <span>Create Journey</span>
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="table-responsive">
        <table class="table">
            <thead>
            <tr>
                <th>Ngày</th>
                <th>Số lượng chuyến tàu</th>
                <th>Danh sách tên tàu</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="entry : ${groupedJourneys}">
                <tr>
                    <td th:text="${entry.key}"></td> <!-- Ngày -->
                    <td th:text="${entry.value}"></td> <!-- Số lượng chuyến tàu -->
                    <td th:text="${groupedTrainNames[entry.key]}"></td> <!-- Danh sách tên tàu -->
                    <td>
                        <a th:href="@{/admin/train-journeys/create?departureDate={date}(date=${entry.key})}" class="btn btn-primary btn-sm">
                            <i class="btn-icon-prepend" data-feather="eye"></i> View
                        </a>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>
</div>

</html>
