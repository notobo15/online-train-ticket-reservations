<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout/layout}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Schedule</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@3.2.0/dist/fullcalendar.min.css" rel="stylesheet">

    <style>
        /* Make both columns have the same height */
        .row {
            display: flex;
        }
        .col-md-8, .col-md-4 {
            display: flex;
            flex-direction: column;
            height: 100%; /* Make columns take full height */
        }
        /* Make the train list column scrollable */
        .train-container {
            overflow-y: auto;
            max-height: 700px;
        }
        .selected-day {
            background-color: #007bff !important;
            color: white !important;
        }
        .fc-left h2 {
            font-size: 20px
        }
    </style>
</head>

<div layout:fragment="content">
    <nav class="page-breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
            <li class="breadcrumb-item" th:href="@{/admin/train-journeys}">Train Journeys</li>
            <li class="breadcrumb-item active" aria-current="page">List</li>
        </ol>
    </nav>

    <h3>Create Train Journey</h3>

    <div class="my-3">
        <a th:href="@{/admin/train-journeys/create-range}" type="button" class="btn btn-outline-primary btn-icon-text">
            <i class="btn-icon-prepend" data-feather="plus"></i>
            <span>Create Range Journey</span>
        </a>
    </div>

    <div class="container">
        <form th:action="@{/admin/train-journeys/create}" method="post">
            <div class="row">
                <!-- Column for FullCalendar (8 parts) -->
                <div class="col-md-8">
                    <div id="calendar"></div>
                </div>

                <!-- Column for Train List (4 parts) -->
                <div class="col-md-4">
                    <div class="train-container">
                        <h4>Select Trains</h4>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="selectAll"/>
                            <label class="form-check-label">Select All</label>
                        </div>
                        <div th:each="train : ${trains}">
                            <div class="form-check">
                                <!-- Kiểm tra xem trainId có có trong journeyTrainIds hay không -->
                                <input class="form-check-input"
                                       type="checkbox"
                                       th:value="${train.trainId}"
                                       th:name="selectedTrains"
                                       th:id="'trainCheckbox_' + ${train.trainId}"
                                       th:checked="${journeyTrainIds.contains(train.trainId)}" />
                                <label class="form-check-label" th:text="${train.trainNumber}"></label>
                            </div>
                        </div>
                        <input type="hidden" id="selectedDate" name="departureDate" th:value="${departureDate}"/>
                    </div>
                    <div class="row">
                        <button type="submit" class="btn btn-primary">Update Journey</button>
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>

<div layout:fragment="scripts">
    <!-- jQuery (FullCalendar yêu cầu) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Moment.js (FullCalendar yêu cầu) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/moment.min.js"></script>

    <!-- FullCalendar JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.4.0/fullcalendar.min.js"></script>

    <script>
        $(document).ready(function() {
            // Lấy departureDate từ URL
            var urlParams = new URLSearchParams(window.location.search);
            var departureDate = urlParams.get('departureDate'); // Lấy giá trị departureDate từ URL

            // Initialize FullCalendar with Bootstrap 5 theme
            $('#calendar').fullCalendar({
                themeSystem: 'bootstrap5',
                header: {
                    right: 'prev, today, next'
                },
                buttonText: {
                    today: 'Today',
                    month: 'Month',
                    week: 'Week',
                    day: 'Day',
                    list: 'List'
                },

                dayClick: function(date, jsEvent, view) {
                    // Get the selected date
                    var selectedDate = date.format();
                    var url = '/admin/train-journeys/create?departureDate=' + selectedDate; // Add the selected date as URL parameter

                    // Redirect to the same page with the selected date as a parameter
                    window.location.href = url;
                },
                viewRender: function(view, element) {
                    // Check if the current date matches departureDate from URL
                    if (departureDate) {
                        var selectedDay = moment(departureDate, "YYYY-MM-DD").format("YYYY-MM-DD");

                        // Lặp qua tất cả các ngày trong FullCalendar sau khi đã render
                        $('#calendar').find('.fc-day').each(function() {
                            var day = $(this).data('date'); // Lấy ngày từ thuộc tính data-date của fc-day
                            console.log(day);  // Kiểm tra giá trị day trên console
                            if (day === selectedDay) {
                                $(this).addClass('selected-day'); // Áp dụng class 'selected-day' nếu ngày khớp
                            }
                        });
                    }
                }
            });

            // Select all checkbox functionality
            $('#selectAll').click(function() {
                var isChecked = $(this).prop('checked');
                // Select or deselect all train checkboxes
                $('input[id^="trainCheckbox"]').prop('checked', isChecked);
                updateSelectAllCheckbox(); // Cập nhật lại trạng thái của Select All checkbox
            });

            // Kiểm tra trạng thái của các checkbox khi một checkbox train được thay đổi
            $('input[id^="trainCheckbox"]').change(function() {
                updateSelectAllCheckbox(); // Cập nhật lại trạng thái của Select All checkbox
            });

            function updateSelectAllCheckbox() {
                // Kiểm tra xem tất cả các checkbox train có được checked hay không
                var allChecked = $('input[id^="trainCheckbox"]').length === $('input[id^="trainCheckbox"]:checked').length;
                $('#selectAll').prop('checked', allChecked); // Nếu tất cả đều được chọn, set Select All checked
            }
             updateSelectAllCheckbox()
        });
    </script>
</div>

</html>
