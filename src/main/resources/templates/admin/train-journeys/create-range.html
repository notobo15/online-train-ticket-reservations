<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout/layout}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Schedule</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Daterangepicker CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />

    <style>
        .train-container {
            overflow-y: auto;
            max-height: 700px;
        }
        .selected-day {
            background-color: #007bff !important;
            color: white !important;
        }
      .fc-left h2 {
            font-size: 20px
        }
    </style>
</head>

<div layout:fragment="content">

    <nav class="page-breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
            <li class="breadcrumb-item" th:href="@{/admin/train-journeys}">Train Journeys</li>
            <li class="breadcrumb-item active" aria-current="page">List</li>
        </ol>
    </nav>

    <h3>Create Train Range Journey</h3>

    <div class="my-3">
        <a th:href="@{/admin/train-journeys/create}" type="button" class="btn btn-outline-primary btn-icon-text">
            <i class="btn-icon-prepend" data-feather="plus"></i>
            <span>Create A Journey</span>
        </a>
    </div>

    <div class="container">
        <form th:action="@{/admin/train-journeys/create-range}" method="post">
            <div class="row">
                <!-- Column for Date Range Picker (8 parts) -->
                <div class="col-md-8">
                    <div>
                        <label for="departureDate">Select Date Range</label>
                        <input type="text" id="departureDate" name="departureDate" class="form-control" />
                    </div>
                    <div class="my-3">
                        <button type="submit" class="btn btn-primary">Create Range Journey</button>
                    </div>
                </div>

                <!-- Column for Train List (4 parts) -->
                <div class="col-md-4">
                    <div class="train-container">
                        <h4>Select Trains</h4>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="selectAll"/>
                            <label class="form-check-label">Select All</label>
                        </div>
                        <div th:each="train : ${trains}">
                            <div class="form-check">
                                <input class="form-check-input"
                                       type="checkbox"
                                       th:value="${train.trainId}"
                                       th:name="selectedTrains"
                                       th:id="'trainCheckbox_' + ${train.trainId}" />
                                <label class="form-check-label" th:text="${train.trainNumber}"></label>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </form>
    </div>
</div>

<div layout:fragment="scripts">
    <!-- jQuery (Daterangepicker yêu cầu) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
    <!-- Moment.js (Daterangepicker yêu cầu) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <!-- Daterangepicker JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>

    <script>
        $(document).ready(function() {
            // Khởi tạo daterangepicker
            $('#departureDate').daterangepicker({
                locale: {
                    format: 'YYYY-MM-DD', // Định dạng ngày tháng (bạn có thể thay đổi theo ý muốn)
                },
                singleDatePicker: false, // Cho phép chọn phạm vi ngày
                showDropdowns: true // Hiển thị danh sách lựa chọn tháng và năm
            });

            // Select all checkbox functionality
            $('#selectAll').click(function() {
                var isChecked = $(this).prop('checked');
                // Select or deselect all train checkboxes
                $('input[id^="trainCheckbox"]').prop('checked', isChecked);
            });
        });
    </script>
</div>

</html>
